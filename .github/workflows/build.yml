name: Chaindata Build

on:
  # runs after each push to main branch
  push:
    branches:
      - main
    paths-ignore: ["assets/bittensor/hotkeys/**"]
  # can be run manually from the `Actions` tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # only run 1 job per branch/pr/etc at a time
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-main:
    name: "Build main"
    uses: ./.github/workflows/build-jobs.yml # zizmor: ignore[self-repository]
    if: github.ref_name == 'main'
    secrets:
      CHAINDATA_CI_SUPERUSER_ACCESS_TOKEN: ${{ secrets.CHAINDATA_CI_SUPERUSER_ACCESS_TOKEN }}

  build-pr:
    name: "Build PR"
    uses: ./.github/workflows/build-jobs.yml # zizmor: ignore[self-repository]
    if: github.ref_name != 'main'
    with:
      environment: "pr-builds"
    secrets:
      CHAINDATA_CI_SUPERUSER_ACCESS_TOKEN: ${{ secrets.CHAINDATA_CI_SUPERUSER_ACCESS_TOKEN }}
